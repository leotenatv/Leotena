<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com">
    </script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js">
    </script>
    <script type="application/javascript"
            src="/assets/packages/flutter_inappwebview_web/assets/web/web_support.js"
            defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'sans': ['Poppins', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
                    colors: {
                        'brand': '#dc2626',
                        'brand-blue': '#ef4444',
                        'surface': '#0a0a0a',
                        'surface-soft': '#111111',
                        'surface-muted': '#1c1c1c',
                    },
                    keyframes: {
                        shimmer: { '0%': { transform: 'translateX(-100%)' }, '100%': { transform: 'translateX(100%)' } },
                        'pulse-ring': { '0%': { transform: 'scale(.33)' }, '80%,100%': { opacity: '0' } },
                    },
                }
            }
        }
    </script>
    <style>
        :root {
            --brand-blue: #ef4444;
            --surface: #060710;
        }
        body {
            background:
              linear-gradient(120deg, rgba(6,8,20,0.92), rgba(15,8,30,0.85)),
              url('assets/Mova-985cba89-0135-4e5b-bda6-0ca4c21fb323.png') center/cover no-repeat fixed;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
              radial-gradient(500px 300px at 12% 12%, rgba(239, 68, 68, 0.16) 0%, rgba(239, 68, 68, 0) 70%),
              radial-gradient(420px 320px at 84% 22%, rgba(99,102,241,0.18) 0%, rgba(99,102,241,0) 72%),
              linear-gradient(to bottom, rgba(2,6,23,0.65), rgba(2,6,23,0.45));
            z-index: 0;
        }
        * {
            scrollbar-width: thin;
            scrollbar-color: #27272a transparent;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .shimmer {
            position: relative;
            overflow: hidden;
            background: rgba(24, 24, 27, 0.5);
            border-radius: 0.5rem;
        }
        .shimmer::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.05) 50%, transparent 100%);
            animation: shimmer 1.5s infinite ease-in-out;
        }
        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }
        .text-shadow-sm {
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }
        .text-shadow-md {
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }
        .pulse-ring::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: rgba(0, 183, 255, 0.4);
            border-radius: inherit;
            left: -50%;
            top: -50%;
            animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
        }
        @keyframes pulse-ring {
            0% {
                transform: scale(.33);
            }
            80%,
            100% {
                opacity: 0;
            }
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .slide-up {
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .liquid-glass-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.26);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                0 14px 30px rgba(0, 0, 0, 0.45),
                0 3px 10px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .liquid-glass-card::before {
            content: none;
        }
        .liquid-glass-card::after {
            content: none;
        }
        .liquid-edge-highlight {
            display: none;
        }
    </style>
</head>
<body class="text-white font-sans antialiased overflow-x-hidden selection:bg-brand selection:text-white">

            </button>
            <button data-view="Profile" class="bottom-nav-btn flex flex-col items-center gap-1 transition-all text-zinc-500">

    </div>

            { id: 'm2', title: 'Thriller Central', category: 'Movies', isLive: true, isLocked: true,

        const BUNDLES = [
            { id: 'b1', name: 'Almasi (Diamond)', price: '2,000', duration: 'Wiki Moja', days: 7,

            { id: 'b2', name: 'Dhahabu (Gold)', price: '5,000', duration: 'Mwezi Mmoja', days: 30,
                description: 'Our most popular plan. 30 days of premium entertainment.' },

                description: 'Stay connected for longer. 90 days of non-stop action.' },
        ];

        const REVENUE_DATA = [
            { name: 'M', revenue: 420 }, { name: 'T', revenue: 580 }, { name: 'W', revenue: 490 },
            { name: 'T', revenue: 720 }, { name: 'F', revenue: 850 }, { name: 'S', revenue: 1020 }, { name: 'S',
                revenue: 980 },

        const ADMIN_CHANNELS = [

            { id: '2', name: 'Netflix Premium', viewers: 850, status: 'Active', locked: true, quality: 'HD' },
            { id: '3', name: 'CNN Global', viewers: 320, status: 'Active', locked: false, quality: 'HD' },
            { id: '4', name: 'Action Max', viewers: 640, status: 'Active', locked: true, quality: '4K' },
            { id: '5', name: 'Nat Geo Wild', viewers: 180, status: 'Active', locked: false, quality: 'HD' },
        ];

        const TRANSACTIONS = [
            { id: 'TX-1', user: 'IAMMW...', amount: '2,000', method: 'M-Pesa', status: 'Success' },
            { id: 'TX-2', user: 'JOHN D', amount: '5,000', method: 'Tigo', status: 'Success' },
            { id: 'TX-3', user: 'SARAH', amount: '12,000', method: 'Airtel', status: 'Pending' },
        ];

        // ==================== STATE ====================
        let currentView = 'Home';
        let selectedChannel = null;
        let paymentBundle = null;
        let showTutorial = false;
        let isPremium = false;
        let subscriptionExpiry = null;
        let audioContext = null;
        let audioSource = null;
        let preloadedAudio = {};
        let tutorialStep = 0;
        let tutorialPlaying = true;
        let tutorialMuted = false;
        let tutorialAudioLoading = false;
        let heroIndex = 0;
        let heroInterval = null;

        // Init premium state from localStorage
        try {
            const stored = localStorage.getItem('supastream_premium');
            if (stored) {
                const { expiry } = JSON.parse(stored);
                if (new Date(expiry).getTime() > new Date().getTime()) {
                    isPremium = true;
                    subscriptionExpiry = expiry;
                }
            }
        } catch (e) {}

        // ==================== ROUTING ====================
        function checkHash() {
            const hash = window.location.hash;
            if (hash === '#admin') {
                document.getElementById('main-app').classList.add('hidden');
                document.getElementById('admin-app').classList.remove('hidden');
                document.getElementById('modal-overlay').classList.add('hidden');
                document.getElementById('tutorial-overlay').classList.add('hidden');
                renderAdminDashboard();
            } else {
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('admin-app').classList.add('hidden');
                lucide.createIcons();
            }
        }

        window.addEventListener('hashchange', checkHash);
        checkHash();

        // ==================== NAVIGATION ====================
        function navigate(view) {
            if (view === currentView && !selectedChannel && view !== 'Player') return;
            if (view === 'Player' && !selectedChannel) return;

            currentView = view;
            if (view !== 'Player') selectedChannel = null;
            if (view === 'Unlock') showTutorial = true;

            updateNavStyles();
            renderMainContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            lucide.createIcons();
        }

        function updateNavStyles() {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const v = btn.dataset.view;
                if (v === currentView) {
                    btn.classList.add('text-white', 'underline', 'decoration-brand', 'decoration-2',
                        'underline-offset-4');
                    btn.classList.remove('text-zinc-400');
                } else {
                    btn.classList.remove('text-white', 'underline', 'decoration-brand', 'decoration-2',
                        'underline-offset-4');
                    btn.classList.add('text-zinc-400');
                }
            });
            document.querySelectorAll('.bottom-nav-btn').forEach(btn => {
                const v = btn.dataset.view;
                if (v === currentView) {
                    btn.classList.add('text-brand');
                    btn.classList.remove('text-zinc-500');
                } else {
                    btn.classList.remove('text-brand');
                    btn.classList.add('text-zinc-500');
                }
            });
            const profileBtn = document.getElementById('profile-btn');
            if (profileBtn) {
                if (currentView === 'Profile') {
                    profileBtn.classList.add('border-white');
                    profileBtn.classList.remove('border-white/20');
                } else {
                    profileBtn.classList.remove('border-white');
                    profileBtn.classList.add('border-white/20');
                }
            }
        }

        // Event delegation for navigation
        document.addEventListener('click', (e) => {
            const navBtn = e.target.closest('[data-view]');
            if (navBtn && !e.target.closest('#admin-app') && !e.target.closest('#modal-overlay') && !e.target
                .closest('#tutorial-overlay')) {
                const view = navBtn.dataset.view;
                if (view === 'Profile' && navBtn.id === 'profile-btn') navigate('Profile');
                else if (navBtn.classList.contains('nav-btn') || navBtn.classList.contains('bottom-nav-btn'))
                    navigate(view);
            }
            const logoBtn = e.target.closest('#nav-logo');
            if (logoBtn) navigate('Home');
            const adminLink = e.target.closest('[data-admin-link]');
            if (adminLink) {
                e.preventDefault();
                window.location.hash = '#admin';
            }
        });

        // ==================== RENDER MAIN CONTENT ====================
        function renderMainContent() {
            const container = document.getElementById('main-content');
            if (!container) return;
            let html = '';

            switch (currentView) {
                case 'Home':
                    html = renderHomeView();
                    break;
                case 'Live':
                    html = renderGridView('Live Events', MOCK_CHANNELS.filter(c => c.isLive));
                    break;
                case 'Movies':
                    html = renderGridView('Cinema Highlights', MOCK_CHANNELS.filter(c => c.category === 'Movies'));
                    break;
                case 'Unlock':
                    html = renderFunguaZoteView();
                    break;
                case 'Profile':
                    html = renderProfileView();
                    break;
                case 'Player':
                    html = renderPlayerView();
                    break;
                default:
                    html = renderHomeView();
            }

            container.innerHTML = html;
            lucide.createIcons();
            attachChannelCardListeners();
            if (currentView === 'Home') startHeroCarousel();
            if (currentView === 'Player') setupPlayerLoading();
        }

                    </button>
                    <button class="flex items-center gap-2 px-4 py-2 rounded-[10px] bg-zinc-900/90 border border-zinc-800 text-zinc-300 text-xs font-black uppercase tracking-wider whitespace-nowrap hover:border-brand-blue hover:text-brand-blue hover:bg-zinc-900 transition-all duration-200">

        async function playTutorialVoice(stepIndex) {
            try {
                const text = TUTORIAL_STEPS[stepIndex].voiceText;
                const response = await fetch(
                    'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-goog-api-key': window.GEMINI_API_KEY || ''
                        },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: text }] }],
                            generationConfig: { responseModalities: ['AUDIO'] }
                        })
                    });
                if (!response.ok) return;
                const data = await response.json();
                const base64Audio = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData?.mimeType
                    ?.startsWith('audio/'))?.inlineData?.data;
                if (base64Audio && tutorialPlaying && !tutorialMuted) playPCM(base64Audio);
            } catch (e) {
                console.log('TTS unavailable in browser demo:', e.message);
            }
        }

        function playPCM(base64Data) {
            try {
                if (!audioContext) audioContext = new(window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
                const binaryString = atob(base64Data);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
                const pcmData = new Int16Array(bytes.buffer);
                const audioBuffer = audioContext.createBuffer(1, pcmData.length, 24000);
                const channelData = audioBuffer.getChannelData(0);
                for (let i = 0; i < pcmData.length; i++) channelData[i] = pcmData[i] / 32768;
                if (audioSource) { try { audioSource.stop(); } catch (e) {} }
                audioSource = audioContext.createBufferSource();
                audioSource.buffer = audioBuffer;
                audioSource.connect(audioContext.destination);
                audioSource.start();
            } catch (e) { console.log('Audio playback error:', e.message); }
        }

                  <div class="flex-1 relative z-10 flex flex-col">
                    <div class="flex items-baseline gap-2 mb-4"><span class="text-4xl font-black italic tracking-tighter leading-none">Tsh 4.2M</span><span class="text-[10px] font-black text-green-500 uppercase">+12% This Period</span></div>
                    <div class="flex-1 -mx-4"><svg viewBox="0 0 400 150" class="w-full h-full"><defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stop-color="#3b82f6" stop-opacity="0.2"/><stop offset="95%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient></defs><path d="M0,120 L57,100 L114,110 L171,80 L228,60 L285,30 L342,40 L400,35 L400,150 L0,150 Z" fill="url(#grad)" stroke="#3b82f6" stroke-width="4" fill="none"/></svg></div>

        // ==================== COUNTDOWN TIMER ====================
        function startAllCountdowns() {
            document.querySelectorAll('.countdown-timer').forEach(el => {
                const expiry = el.dataset.expiry;
                if (!expiry) return;
                const update = () => {
                    const now = new Date().getTime();
                    const distance = new Date(expiry).getTime() - now;
                    if (distance <= 0) { el.innerHTML =
                            '<span class="text-red-500 text-xs font-black">EXPIRED</span>'; return; }
                    const d = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((distance % (1000 * 60)) / 1000);
                    el.innerHTML = `
                    <div class="flex flex-col items-center bg-zinc-900 border border-zinc-800 p-2 rounded-lg w-16"><span class="text-xl font-black tabular-nums tracking-tighter">${String(d).padStart(2,'0')}</span><span class="text-[8px] uppercase font-bold text-zinc-500">Siku</span></div>
                    <div class="flex flex-col items-center bg-zinc-900 border border-zinc-800 p-2 rounded-lg w-16"><span class="text-xl font-black tabular-nums tracking-tighter">${String(h).padStart(2,'0')}</span><span class="text-[8px] uppercase font-bold text-zinc-500">Masaa</span></div>
                    <div class="flex flex-col items-center bg-zinc-900 border border-zinc-800 p-2 rounded-lg w-16"><span class="text-xl font-black tabular-nums tracking-tighter">${String(m).padStart(2,'0')}</span><span class="text-[8px] uppercase font-bold text-zinc-500">Dakika</span></div>
                    <div class="flex flex-col items-center bg-zinc-900 border border-zinc-800 p-2 rounded-lg w-16"><span class="text-xl font-black tabular-nums tracking-tighter">${String(s).padStart(2,'0')}</span><span class="text-[8px] uppercase font-bold text-zinc-500">Sekunde</span></div>`;
                };
                update();
                setInterval(update, 1000);
            });
        }

        // ==================== INITIALIZATION ====================
        function init() {
            checkHash();
            if (!window.location.hash || window.location.hash === '') {
                renderMainContent();
                updateNavStyles();
                startHeroCarousel();
            }
            lucide.createIcons();
            startAllCountdowns();
        }

        // Handle admin link clicks
        document.addEventListener('click', (e) => {
            const adminLink = e.target.closest('[data-admin-link]');
            if (adminLink) {
                e.preventDefault();
                window.location.hash = '#admin';
            }
        });

        // Initial render
        init();

        // Re-render on hash change
        window.addEventListener('hashchange', () => {
            checkHash();
            if (!window.location.hash || window.location.hash === '') {
                renderMainContent();
                updateNavStyles();
                startHeroCarousel();
                startAllCountdowns();
            }
        });

        // Global functions for onclick handlers
        window.navigate = navigate;
        window.selectBundle = selectBundle;
        window.closePaymentModal = closePaymentModal;
        window.handlePaymentSubmit = handlePaymentSubmit;
        window.openTutorial = openTutorial;
        window.closeTutorial = closeTutorial;
        window.goToTutorialStep = goToTutorialStep;
        window.nextTutorialStep = nextTutorialStep;
        window.toggleTutorialAudio = toggleTutorialAudio;
        window.toggleTutorialMute = toggleTutorialMute;

        console.log('🚀 Leotena TV loaded successfully! All systems ready.');
        console.log('📱 Main App: # (default) | 🔧 Admin: #admin');
